[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "network-health-check"
version = "0.1.0"
description = "Cisco IOS network health collector using Netmiko"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.20,<2",
  "cryptography>=46,<47",
  "fastapi>=0.143,<1",
  "netmiko>=4.5,<5",
  # Paramiko 5 removed the group1 KEX required by the Cisco 3660 IOS lab.
  "paramiko>=3.5.1,<4",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.15,<3",
  "sqlalchemy>=2.0.54,<2.1",
  "uvicorn[standard]>=0.51,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-cov>=7,<8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

